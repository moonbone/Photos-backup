<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}PhotoVault{% endblock %}</title>
<style>
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { font-family: system-ui, sans-serif; margin: 0; background: Canvas; color: CanvasText; }
header { display: flex; gap: 1rem; align-items: baseline; padding: .6rem 1rem;
         border-bottom: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
         position: sticky; top: 0; background: Canvas; flex-wrap: wrap; }
header h1 { font-size: 1.1rem; margin: 0; }
header a { color: inherit; text-decoration: none; opacity: .8; }
header a:hover { opacity: 1; }
main { padding: 1rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.grid a { display: block; aspect-ratio: 1; overflow: hidden; border-radius: 4px;
          background: color-mix(in srgb, CanvasText 8%, transparent); position: relative; }
.grid img { width: 100%; height: 100%; object-fit: cover; }
.grid .noimg { display: flex; align-items: center; justify-content: center; height: 100%;
               font-size: .7rem; opacity: .6; text-align: center; padding: 4px; word-break: break-all; }
.badge { font-size: .65rem; padding: 1px 6px; border-radius: 8px;
         background: color-mix(in srgb, CanvasText 12%, transparent); }
.badge.warn { background: #b4540a; color: #fff; }
.badge.ok { background: #2e7d32; color: #fff; }
h2.day { font-size: .95rem; margin: 1.2rem 0 .4rem; opacity: .85; position: sticky; }
table.meta { border-collapse: collapse; font-size: .85rem; max-width: 100%; }
table.meta td { padding: 3px 10px 3px 0; vertical-align: top; word-break: break-word; }
table.meta td:first-child { opacity: .65; white-space: nowrap; }
.filters { display: flex; gap: .5rem; flex-wrap: wrap; font-size: .85rem; }
.filters select, .filters button { font: inherit; }
.pager { display: flex; gap: 1rem; margin: 1.5rem 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.card { border: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
        border-radius: 8px; padding: .8rem; }
.card .num { font-size: 1.6rem; font-weight: 600; }
.warnbox { border-left: 4px solid #b4540a; padding: .5rem .8rem; margin: .8rem 0;
           background: color-mix(in srgb, #b4540a 10%, transparent); }
img.detail { max-width: 100%; max-height: 75vh; border-radius: 6px; }
details { margin: .6rem 0; }
</style>
</head>
<body>
<header>
  <h1><a href="/">📦 PhotoVault</a></h1>
  <a href="/">Timeline</a>
  <a href="/dashboard">Dashboard</a>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
