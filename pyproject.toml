[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photovault"
version = "0.1.0"
description = "Self-hosted photo backup with verified cloud storage and trust-before-delete"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "sqlalchemy>=2.0",
    "boto3>=1.34",
    "pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "moto[s3]>=5.0",
    "httpx>=0.27",
]

[project.scripts]
photovault = "photovault.cli:app"

[tool.setuptools.packages.find]
include = ["photovault*"]

[tool.setuptools.package-data]
"photovault.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
