# PhotoVault configuration.
# Copy to ~/.config/photovault/config.toml (or pass --config / set $PHOTOVAULT_CONFIG).

[library]
# Where the catalog, originals, thumbnails, and reports live.
path = "/data/photovault"
# Used to render dates for files whose EXIF has no timezone, and for mtime fallback.
home_timezone = "Asia/Jerusalem"

[storage]
# Any S3-compatible provider. Examples:
#   Backblaze B2:  https://s3.us-west-000.backblazeb2.com
#   Cloudflare R2: https://<account-id>.r2.cloudflarestorage.com
#   AWS S3:        omit `endpoint`, set `region`
#   MinIO (local): http://127.0.0.1:9000
endpoint = "https://s3.us-west-000.backblazeb2.com"
bucket = "my-photovault"
# region = "us-east-1"
# Credentials: prefer env vars PHOTOVAULT_S3_KEY / PHOTOVAULT_S3_SECRET.
# They can be set here instead, but keep this file private if you do.
# access_key = ""
# secret_key = ""

# One [[sources]] block per device. `photovault watch` scans these staging
# folders; point your phone's sync tool (Syncthing, PhotoSync) at them.
[[sources]]
name = "phone-a"
staging = "/data/photovault/staging/phone-a"

[[sources]]
name = "dslr"
staging = "/data/photovault/staging/dslr"

[ingest]
# Extra filename date patterns (regex with named groups Y M D and optional h m s),
# tried before the built-ins. Example for "holiday25122023.jpg":
# extra_filename_date_patterns = ['holiday(?P<D>\d{2})(?P<M>\d{2})(?P<Y>\d{4})']
extra_filename_date_patterns = []

[verify]
# Objects deep-verified (downloaded + re-hashed) per verify run, rotating
# through the least-recently-verified first.
sample_size = 50

[web]
host = "0.0.0.0"
port = 8420
# Required for the upload API and recommended whenever the UI is reachable
# beyond localhost. Send as ?token=... once (sets a cookie) or the
# X-PhotoVault-Token header.
# token = "change-me"
